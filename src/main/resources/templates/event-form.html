<!DOCTYPE html>
<html>
<head>
    <title>Event Form</title>
</head>
<body>
<h1>Event Form</h1>

    <form th:action="@{/events}"
      th:object="${event}"
      method="post">
    <input type="text"
           th:field="*{name}">
    <input type="text"
           th:field="*{date}">
    <input type="text"
           th:field="*{description}">
    <button type="submit">
        Create Event
    </button>
    </form>

</form>
</body>
</html>
