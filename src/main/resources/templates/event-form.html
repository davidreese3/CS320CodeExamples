<!DOCTYPE html>
<html>
<head>
    <title>Event Form</title>
</head>
<body>
<h1>Event Form</h1>

    <form th:action="@{/events}"
          th:object="${event}"
          method="post">
        <!-- Lecture Notes: Added for validation -->
        <p th:if="${#fields.hasErrors('name')}"
           th:errors="*{name}"></p>
        <p th:if="${#fields.hasErrors('date')}"
           th:errors="*{date}"></p>
        <p th:if="${#fields.hasErrors('description')}"
           th:errors="*{description}"></p>
        <input type="text"
               th:field="*{name}">
        <input type="text"
               th:field="*{date}">
        <input type="text"
               th:field="*{description}">
        <button type="submit">
            Create Event
        </button>
    </form>
</body>
</html>
