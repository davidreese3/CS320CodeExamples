<!DOCTYPE html>
<html>
<head>
    <title>Event List</title>
</head>
<body>
<h1>Event List</h1>

<div th:each="event : ${events}">

    <h2 th:text="${event.name}">
        Event Name
    </h2>

    <p th:text="${event.date}">
        Event Date
    </p>

    <p th:text="${event.description}">
        Event Description
    </p>

</div>

</body>
</html>
