<!DOCTYPE html>
<!-- Lecture Notes: Updated th -->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Event List</title>
</head>
<body>

<!-- Lecture Notes: Logout form addition -->
<form th:action="@{/logout}" method="post">
    <button type="submit">Logout</button>
</form>

<!-- Lecture Notes: Role-based interface visibility -->
<!-- sec:authorize only renders this content for administrators. -->

<div sec:authorize="hasRole('ADMIN')">
    <a th:href="@{/events/new}">
        Create Event
    </a>
</div>

<h1>Event List</h1>

<div th:each="event : ${events}">
    <!-- Lecture Notes: Added for clickable link -->
    <a th:href="@{/events/{id}(id=${event.id})}"
       th:text="${event.name}">
        Event Name
    </a>

    <p th:text="${event.date}">
        Event Date
    </p>

    <p th:text="${event.description}">
        Event Description
    </p>

</div>

</body>
</html>
